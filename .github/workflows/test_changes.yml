name: Test changed installers
on:
  push:

permissions:
  contents: read

jobs:
  pre_commit:
    name: Pre-commit
    uses: ./.github/workflows/pre-commit.yml

  list_installers:
    name: List changed installers
    runs-on: ubuntu-latest
    outputs:
      installers: ${{steps.dirs.outputs.changed_installers}}
    steps:
      - name: Check out code
        uses: actions/checkout@v7 # zizmor: ignore[artipacked,unpinned-uses]

      - name: Get changed installer files
        id: files
        uses: tj-actions/changed-files@v47 # zizmor: ignore[unpinned-uses]
        with:
          files: programs/**

      - name: Get changed installer names
        id: dirs
        env:
          CHANGED_FILES: ${{steps.files.outputs.all_changed_files}}
        run: |
          {
            printf "changed_installers="
            printf "%s" "$CHANGED_FILES" \
            | cut -d/ -f2 | sort -u | jq -R | jq -s -c -M
          } >> "$GITHUB_OUTPUT"

  test_installers:
    name: Test installers
    needs: [pre_commit, list_installers]
    if: success() && needs.list_installers.outputs.installers != '[]'
    uses: ./.github/workflows/test_installers.yml
    with:
      installers: ${{needs.list_installers.outputs.installers}}
