name: Test installers
on:
  workflow_call:
    inputs:
      installers:
        description: A JSON list of install names
        required: true
        type: string

permissions:
  contents: read

jobs:
  test_installers:
    name: Test installers
    runs-on: ubuntu-latest
    container:
      image: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        installer: ${{ fromJson(inputs.installers) }}
        os: ["ubuntu:24.04"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Docker
        run: ./scripts/prepare_docker.bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test ${{matrix.installer}}
        shell: su norm --command "bash --login {0}"
        run: |
          set -euo pipefail

          # Run a command again after an error. Most errors come from a flaky
          # download server, so a second attempt usually works. Two failures in
          # a row need attention.
          retry_once() {
            "$@" || {
              echo "::warning::Attempt 2 of: $*"
              "$@"
            }
          }

          install="programs/$INSTALLER/install.bash"

          retry_once "$install"
          echo "=== Installed. Running again to test idempotency. ==="
          retry_once "$install"
        env:
          INSTALLER: ${{matrix.installer}}
